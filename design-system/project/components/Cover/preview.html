<!-- @dsCard height=288 -->
<style>
  html, body { margin: 0; background: var(--background); }
  .cv { position: relative; width: 960px; height: 288px; overflow: hidden; background: var(--background); }
  .cv svg { position: absolute; left: 0; top: 0; }
  .k-primary { fill: var(--primary); }
  .k-accent { fill: var(--accent); }
  .k-ink { fill: var(--foreground); }
  .k-muted { fill: var(--muted-foreground); }
  .blk { rx: var(--radius-lg); }
  .rule { stroke: var(--background); stroke-width: 1px; }
  .quote { stroke: var(--primary); stroke-width: 3px; }
  .name { position: absolute; left: 40px; bottom: 34px; max-width: 880px; }
  .name h1 { margin: 0; font: 600 64px/.95 var(--font-serif); letter-spacing: -0.025em; color: var(--foreground); }
  .name p { margin: 10px 0 0; font: 400 14px/20px var(--font-sans); color: var(--muted-foreground); }
</style>
<div class="cv">
  <svg width="960" height="112" viewBox="0 0 960 112" aria-hidden="true">
    <!--
      blocks: primary 520w (identity teal, the big slab), accent 200w (teal wash), foreground 120w (ink), muted-foreground 96w, all 112px tall = 2 x space-14
      arrangement: top-band skeleton (name too wide for the 440px zone); a strip of unequal bands bleeding off the top, bottom corners radius-lg, gaps space-2
      pattern: editorial row, "Rules, not boxes" + "type over decoration": four 1px hairlines cut from the ground across the bands at a space-6 pitch, plus the 3px primary blockquote rule under the strip
      scales: space-2 (8) gaps, space-6 (24) rule pitch, space-14 (56) band unit, radius-lg (6) corners
    -->
    <rect class="k-primary blk" x="0" y="-8" width="520" height="112"/>
    <rect class="k-accent blk" x="528" y="-8" width="200" height="112"/>
    <rect class="k-ink blk" x="736" y="-8" width="120" height="112"/>
    <rect class="k-muted blk" x="864" y="-8" width="96" height="112"/>
    <line class="rule" x1="0" y1="24" x2="960" y2="24"/>
    <line class="rule" x1="0" y1="48" x2="960" y2="48"/>
    <line class="rule" x1="0" y1="72" x2="960" y2="72"/>
    <line class="rule" x1="0" y1="96" x2="960" y2="96"/>
    <line class="quote" x1="40" y1="110" x2="184" y2="110"/>
  </svg>
  <div class="name">
    <h1>marcomachado.dev</h1>
    <p>Engineer. Operator. Builder. A quiet, editorial system for one reading column.</p>
  </div>
</div>
